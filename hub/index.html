<title>Santander Cycles Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: sticky tab bar over one reading column; Plan is a phase list, Brief a requirement table, Concepts a filterable list of cards with course slides first, then outside texts and videos. */
:root {
  --bg: #f5f6f8; --surface: #ffffff; --fg: #1b2330; --muted: #5b6676; --rule: #d8dde5;
  --accent: #0072B2; --flag: #D55E00; --ok: #2f7d4f; --chip: #e8ecf2; --quote: #f0f3f7;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12161d; --surface: #1a2029; --fg: #e3e8ef; --muted: #98a3b3; --rule: #2c3440;
  --accent: #56b4e9; --flag: #f08a4b; --ok: #6cc28f; --chip: #252d39; --quote: #202733; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #12161d; --surface: #1a2029; --fg: #e3e8ef; --muted: #98a3b3; --rule: #2c3440;
  --accent: #56b4e9; --flag: #f08a4b; --ok: #6cc28f; --chip: #252d39; --quote: #202733; color-scheme: dark; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--rule); }
.top-in, .main { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-in { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; padding-block: 10px; }
.brand { font-weight: 600; }
.brand small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
nav { display: flex; gap: 4px; flex-wrap: wrap; }
nav a { text-decoration: none; color: var(--muted); padding: 6px 12px; border-radius: 6px; font-size: 14px; }
nav a[aria-current="page"] { color: var(--accent); background: var(--chip); font-weight: 500; }
nav a:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.main { padding-block: 24px 64px; display: grid; gap: 24px; }
h1 { font-size: 1.5rem; margin: 0; text-wrap: balance; font-weight: 600; }
h2 { font-size: 1.1rem; margin: 0; font-weight: 600; text-wrap: balance; }
h3 { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0; font-weight: 600; }
p { margin: 0; }
.lede { color: var(--muted); max-width: 70ch; }
.banner { border-left: 3px solid var(--flag); background: var(--surface); padding: 10px 14px; border-radius: 4px; }
.question { font-style: italic; background: var(--quote); padding: 12px 16px; border-radius: 6px; max-width: 75ch; }
ul { margin: 0; padding-left: 1.2em; } li + li { margin-top: 2px; }
.pill { font-family: var(--mono); font-size: 11px; padding: 1px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); white-space: nowrap; }
.pill.warn { color: var(--flag); } .pill.ok { color: var(--ok); } .pill.acc { color: var(--accent); }
.phases { display: grid; gap: 12px; }
.phase { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 14px 16px; display: grid; gap: 10px; }
.phase-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.phase-n { font-family: var(--mono); color: var(--muted); font-size: 13px; }
.phase-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.phase-grid > div { min-width: 0; display: grid; gap: 4px; align-content: start; }
.tablebox { overflow-x: auto; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; }
tr:last-child td { border-bottom: none; }
td.sec { font-family: var(--mono); white-space: nowrap; }
td.q { font-style: italic; min-width: 320px; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filters button { font: inherit; font-size: 13px; border: 1px solid var(--rule); background: var(--surface); color: var(--fg); padding: 4px 12px; border-radius: 999px; cursor: pointer; }
.filters button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.cards { display: grid; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 16px 18px; display: grid; gap: 12px; }
.card-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.slides { display: grid; gap: 6px; }
.slide-ref { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; padding-left: 10px; border-left: 2px solid var(--accent); }
.slide-ref b { font-weight: 500; }
.slide-ref .deck { font-size: 13px; color: var(--muted); }
.gap { color: var(--flag); font-size: 14px; }
.refs { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.refs > div { min-width: 0; display: grid; gap: 6px; align-content: start; }
.ref { font-size: 14px; overflow-wrap: anywhere; }
.ref .meta { color: var(--muted); font-size: 13px; }
.pending { color: var(--muted); font-style: italic; font-size: 14px; }
.check { font-family: var(--mono); font-size: 11px; color: var(--ok); }
.check.warn { color: var(--flag); }
.banner { display: grid; gap: 6px; }
a { color: var(--accent); }
.decks { display: grid; gap: 8px; }
.err { color: var(--flag); }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<header class="top"><div class="top-in">
  <div class="brand">Santander Cycles Hub<small>Apprentissage non supervisé · M. Olteanu · Paris-Dauphine 2025–2026</small></div>
  <nav aria-label="Sections">
    <a href="#plan" data-view="plan">Plan</a>
    <a href="#brief" data-view="brief">Brief</a>
    <a href="#concepts" data-view="concepts">Concepts</a>
    <a href="#gaps" data-view="gaps">Gaps</a>
    <a href="https://claude.ai/artifact/AfUPgrnWJvArZTh4Q1mDCG" target="_blank" rel="noopener">Ledger ↗</a>
  </nav>
</div></header>

<main class="main" id="view"><p class="pending">Loading the hub's data files…</p></main>

<script>
(function () {
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = String(text); return n; };
  const list = (items) => { const u = el("ul"); for (const t of items) u.append(el("li", "", t)); return u; };
  const DATA = {};
  const VIEWS = ["plan", "brief", "concepts", "gaps"];
  let groupFilter = "all";
  try { groupFilter = localStorage.getItem("hub-group") || "all"; } catch (e) {}

  async function load(name) {
    const r = await fetch("data/" + name + ".json");
    if (!r.ok) throw new Error(name + ".json: HTTP " + r.status);
    return r.json();
  }

  function viewPlan(root) {
    const p = DATA.plan;
    root.append(el("h1", "", "Plan"), el("p", "banner", p.status));
    const pr = el("div", ""); pr.append(el("h3", "", "Working principles"), list(p.principles)); root.append(pr);
    const box = el("div", "phases");
    for (const ph of p.phases) {
      const c = el("section", "phase");
      const h = el("div", "phase-head");
      h.append(el("span", "phase-n", "Phase " + ph.n), el("h2", "", ph.name), el("span", "pill acc", ph.brief));
      if (ph.course) h.append(el("span", "pill", "slides: " + ph.course));
      h.append(el("span", "pill", ph.dates));
      const st = ph.status || "";
      h.append(el("span", "pill " + (/blocked/.test(st) ? "warn" : /progress|written/.test(st) ? "ok" : ""), st));
      c.append(h);
      const g = el("div", "phase-grid");
      const col = (title, items) => { if (!items || !items.length) return; const d = el("div"); d.append(el("h3", "", title), list(items)); g.append(d); };
      col("Steps", ph.steps); col("Rules to write before running", ph.rules_first); col("Needs you", ph.you); col("Outputs", ph.outputs);
      c.append(g); box.append(c);
    }
    root.append(box);
  }

  function viewBrief(root) {
    const b = DATA.brief;
    root.append(el("h1", "", "Brief"), el("p", "lede", b.source));
    const q = el("div", ""); q.append(el("h3", "", "Central question (§1)"), el("p", "question", "« " + b.question + " »")); root.append(q);
    const box = el("div", "tablebox"); const t = el("table");
    const hr = el("tr"); for (const h of ["Section", "Brief (verbatim)", "Type", "Where we stand", "Where"]) hr.append(el("th", "", h));
    const th = el("thead"); th.append(hr); t.append(th);
    const tb = el("tbody");
    for (const it of b.items) {
      const tr = el("tr");
      tr.append(el("td", "sec", it.sec), el("td", "q", "« " + it.quote + " »"));
      const k = el("td"); k.append(el("span", "pill" + (/required/.test(it.kind) ? " acc" : ""), it.kind)); tr.append(k);
      tr.append(el("td", "", it.status), el("td", "", it.where || "—"));
      tb.append(tr);
    }
    t.append(tb); box.append(t); root.append(box);
  }

  function refItems(arr, kind) {
    const d = el("div");
    d.append(el("h3", "", kind === "texts" ? "Texts and papers" : "Videos"));
    if (!DATA.refs) { d.append(el("p", "pending", "Being verified; added when the check finishes.")); return d; }
    if (!arr || !arr.length) { d.append(el("p", "pending", "No verified item.")); return d; }
    for (const r of arr) {
      const p = el("div", "ref");
      if (kind === "texts") {
        p.append(el("div", "", r.apa));
        const m = [r.where, r.note].filter(Boolean).join(" — ");
        if (m) p.append(el("div", "meta", m));
        if (r.url) { const a = el("a", "", r.url); a.href = r.url; a.target = "_blank"; a.rel = "noopener"; p.append(a); }
      } else {
        const a = el("a", "", r.title); a.href = r.url; a.target = "_blank"; a.rel = "noopener"; p.append(a);
        p.append(el("div", "meta", [r.channel, r.duration, r.year, r.level].filter(Boolean).join(" · ")));
        if (r.note) p.append(el("div", "meta", r.note));
      }
      if (r.check) p.append(el("div", "check" + (/NOT/.test(r.check) ? " warn" : ""), r.check));
      d.append(p);
    }
    return d;
  }

  function viewConcepts(root) {
    const c = DATA.concepts;
    root.append(el("h1", "", "Concepts"), el("p", "lede", "Each concept: a plain definition, where the course slides explain it (printed slide numbers), why it matters for this project, then verified outside texts and videos. Our own numbers are added as each stage runs."));
    const decks = el("div", "decks"); decks.append(el("h3", "", "Course decks"));
    for (const [k, d] of Object.entries(c.decks)) decks.append(el("div", "ref", k + " = " + d.title + " (" + d.file + "). " + d.note));
    root.append(decks);
    if (DATA.refs && DATA.refs.limits) { const b = el("div", "banner"); for (const l of DATA.refs.limits) b.append(el("p", "", l)); root.append(b); }
    const f = el("div", "filters"); f.setAttribute("role", "group"); f.setAttribute("aria-label", "Filter by part of the project");
    const groups = [{ key: "all", name: "All" }, ...c.groups.map((g) => ({ key: g.key, name: g.name + " " + g.brief }))];
    for (const g of groups) {
      const b = el("button", "", g.name); b.type = "button"; b.id = "g-" + g.key; b.setAttribute("aria-pressed", String(groupFilter === g.key));
      b.addEventListener("click", () => { groupFilter = g.key; try { localStorage.setItem("hub-group", g.key); } catch (e) {} render(); });
      f.append(b);
    }
    root.append(f);
    const cards = el("div", "cards");
    for (const k of c.concepts) {
      if (groupFilter !== "all" && k.group !== groupFilter) continue;
      const card = el("article", "card"); card.id = "c-" + k.key;
      const h = el("div", "card-head"); h.append(el("h2", "", k.name));
      const g = c.groups.find((x) => x.key === k.group); if (g) h.append(el("span", "pill acc", g.brief));
      if (k.gap) h.append(el("span", "pill warn", "course gap"));
      card.append(h, el("p", "", k.plain));
      const s = el("div", "slides"); s.append(el("h3", "", "In the course slides"));
      for (const r of k.course) { const x = el("div", "slide-ref"); const t = el("div"); t.append(el("b", "", r.deck + " slides " + r.slides)); x.append(t, el("div", "", r.what)); s.append(x); }
      card.append(s);
      if (k.gap) card.append(el("p", "gap", k.gap));
      const pj = el("div"); pj.append(el("h3", "", "In this project"), el("p", "", k.project)); card.append(pj);
      const refs = el("div", "refs");
        const R = DATA.refs || {};
      refs.append(refItems(R.texts && R.texts[k.key], "texts"), refItems(R.videos && R.videos[k.key], "videos"));
      card.append(refs);
      cards.append(card);
    }
    root.append(cards);
  }

  function viewGaps(root) {
    root.append(el("h1", "", "Gaps"), el("p", "lede", "What the brief needs that the course slides you shared do not explain, or only name. Each is a question for you or the instructor, not a decision."));
    const box = el("div", "tablebox"); const t = el("table");
    const hr = el("tr"); for (const h of ["Topic", "What the slides contain", "Needed for", "Open question"]) hr.append(el("th", "", h));
    const th = el("thead"); th.append(hr); t.append(th); const tb = el("tbody");
    for (const g of DATA.gaps.items) { const tr = el("tr"); for (const f of ["topic", "slides", "needed", "question"]) tr.append(el("td", "", g[f])); tb.append(tr); }
    t.append(tb); box.append(t); root.append(box);
  }

  function render() {
    const v = VIEWS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "plan";
    document.querySelectorAll("nav a[data-view]").forEach((a) => a.setAttribute("aria-current", a.dataset.view === v ? "page" : "false"));
    const root = document.getElementById("view"); root.replaceChildren();
    try { ({ plan: viewPlan, brief: viewBrief, concepts: viewConcepts, gaps: viewGaps })[v](root); }
    catch (e) { root.append(el("p", "err", "This tab could not be drawn: " + e.message)); }
  }

  Promise.all(["plan", "brief", "concepts", "gaps"].map(async (n) => { DATA[n] = await load(n); }))
    .then(async () => { try { DATA.refs = await load("refs"); } catch (e) { DATA.refs = null; } render(); })
    .catch((e) => { const r = document.getElementById("view"); r.replaceChildren(el("p", "err", "The hub's data files could not be loaded (" + e.message + ").")); });
  window.addEventListener("hashchange", render);
})();
</script>
